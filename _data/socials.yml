# _data/socials.yml
#
# CRITICAL: only list socials you ACTUALLY USE, each with a real value.
#
# The jekyll-socials plugin looks every key up in its own registry. A key it
# doesn't recognise — or a key left blank — sends it down a code path that
# expects a nested `logo:` object, and the build dies with:
#   undefined method `[]' for nil
#
# So: no blank keys, no commented-out placeholders with real key names, and no
# invented key names. Add a line only when you have a value for it.
# Icons appear in the order listed here.

email: <<FILL - the address you actually check>>
