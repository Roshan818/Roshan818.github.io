# _data/cv.yml
#
# This is the single source of truth for your CV. Editing it does TWO things:
#   1. Rebuilds the /cv page on the site
#   2. Triggers .github/workflows/render-cv.yml, which regenerates the PDF
# No LaTeX, no Overleaf, no two versions to keep in sync.
#
# Every <<FILL: ...>> below needs a real answer from you. Do not ship it with
# placeholders — an empty highlight is more damaging than a missing section.
#
# Writing the highlights: lead with the verb, end with the outcome. "Built a
# pipeline" is weak. "Cut the nightly DC performance load from 40 to 6 minutes
# by repartitioning on distribution centre" is what gets read twice.

